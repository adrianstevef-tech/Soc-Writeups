<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Analyst -->
  <circle cx="80" cy="78" r="18" fill="#1e293b"/>
  <rect x="65" y="96" width="30" height="34" rx="6" fill="#1e293b"/>
  <text x="80" y="150" text-anchor="middle" font-size="13" fill="#334155">Analyst</text>

  <!-- Arrow Analyst -> Manager -->
  <line x1="115" y1="88" x2="225" y2="88" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="76" text-anchor="middle" font-size="11" fill="#475569">HTTPS/TLS :443</text>

  <!-- Manager box -->
  <rect x="230" y="30" width="270" height="270" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="365" y="65" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Wazuh Manager</text>
  <text x="365" y="92" text-anchor="middle" font-size="13" fill="#1e40af">Dashboard · Indexer · Filebeat</text>
  <line x1="250" y1="108" x2="480" y2="108" stroke="#93c5fd" stroke-width="1"/>
  <text x="365" y="136" text-anchor="middle" font-size="13" fill="#1e40af">Ubuntu Linux</text>
  <text x="365" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">192.168.5.143</text>
  <text x="365" y="196" text-anchor="middle" font-size="12" fill="#475569">Listens on:</text>
  <text x="365" y="218" text-anchor="middle" font-size="12" fill="#475569">TCP/UDP 1514 (events)</text>
  <text x="365" y="240" text-anchor="middle" font-size="12" fill="#475569">TCP 1515 (enrollment)</text>
  <text x="365" y="262" text-anchor="middle" font-size="12" fill="#475569">HTTPS 443 (dashboard)</text>

  <!-- Agent box -->
  <rect x="610" y="100" width="240" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Wazuh Agent</text>
  <text x="730" y="158" text-anchor="middle" font-size="13" fill="#166534">Windows Host</text>
  <text x="730" y="182" text-anchor="middle" font-size="12" fill="#475569">ID: 001</text>
  <text x="730" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">192.168.5.74</text>
  <text x="730" y="228" text-anchor="middle" font-size="11" fill="#475569">Event Viewer · FIM · Syscheck</text>

  <!-- Arrow Manager <-> Agent -->
  <line x1="500" y1="178" x2="605" y2="178" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="552" y="163" text-anchor="middle" font-size="11" fill="#475569">Encrypted Channel</text>
  <text x="552" y="196" text-anchor="middle" font-size="10" fill="#64748b">TCP/UDP 1514 · PSK (AES/Blowfish)</text>

  <text x="450" y="345" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Illustrative architecture diagram — not a screenshot</text>
</svg>
