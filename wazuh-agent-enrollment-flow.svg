<svg viewBox="0 0 1040 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1040" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Group labels -->
  <rect x="20" y="30" width="340" height="24" rx="6" fill="#2563eb"/>
  <text x="190" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">WAZUH MANAGER (UBUNTU)</text>

  <rect x="360" y="30" width="150" height="24" rx="6" fill="#64748b"/>
  <text x="435" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">MANUAL STEP</text>

  <rect x="530" y="30" width="340" height="24" rx="6" fill="#16a34a"/>
  <text x="700" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">WAZUH AGENT (WINDOWS)</text>

  <rect x="870" y="30" width="150" height="24" rx="6" fill="#7c3aed"/>
  <text x="945" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">DASHBOARD</text>

  <!-- Box 1 -->
  <rect x="20" y="90" width="150" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="35" cy="90" r="12" fill="#2563eb"/>
  <text x="35" y="95" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">1</text>
  <text x="95" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Add Agent</text>
  <text x="95" y="147" text-anchor="middle" font-size="11" fill="#1e40af">manage_agents -A</text>
  <text x="95" y="166" text-anchor="middle" font-size="11" fill="#475569">ID: 001</text>
  <text x="95" y="184" text-anchor="middle" font-size="11" fill="#475569">IP: .5.74</text>

  <!-- Arrow 1->2 -->
  <line x1="170" y1="150" x2="188" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Box 2 -->
  <rect x="190" y="90" width="150" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="205" cy="90" r="12" fill="#2563eb"/>
  <text x="205" y="95" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">2</text>
  <text x="265" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Extract Key</text>
  <text x="265" y="147" text-anchor="middle" font-size="11" fill="#1e40af">manage_agents -E</text>
  <text x="265" y="166" text-anchor="middle" font-size="11" fill="#475569">Base64 PSK</text>
  <text x="265" y="184" text-anchor="middle" font-size="11" fill="#475569">(shared secret)</text>

  <!-- Arrow 2->3 -->
  <line x1="340" y1="150" x2="358" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Box 3 -->
  <rect x="360" y="90" width="150" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="375" cy="90" r="12" fill="#64748b"/>
  <text x="375" y="95" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">3</text>
  <text x="435" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Transfer Key</text>
  <text x="435" y="147" text-anchor="middle" font-size="11" fill="#475569">Copy key to</text>
  <text x="435" y="166" text-anchor="middle" font-size="11" fill="#475569">Windows host</text>
  <text x="435" y="184" text-anchor="middle" font-size="11" fill="#475569">(secure channel)</text>

  <!-- Arrow 3->4 -->
  <line x1="510" y1="150" x2="528" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Box 4 -->
  <rect x="530" y="90" width="150" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="545" cy="90" r="12" fill="#16a34a"/>
  <text x="545" y="95" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">4</text>
  <text x="605" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Import Key</text>
  <text x="605" y="147" text-anchor="middle" font-size="11" fill="#166534">+ Set Manager IP</text>
  <text x="605" y="166" text-anchor="middle" font-size="11" fill="#475569">192.168.5.143</text>
  <text x="605" y="184" text-anchor="middle" font-size="11" fill="#475569">Save &amp; confirm</text>

  <!-- Arrow 4->5 -->
  <line x1="680" y1="150" x2="698" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Box 5 -->
  <rect x="700" y="90" width="150" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="715" cy="90" r="12" fill="#16a34a"/>
  <text x="715" y="95" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">5</text>
  <text x="775" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Agent Connects</text>
  <text x="775" y="147" text-anchor="middle" font-size="11" fill="#166534">Port 1514</text>
  <text x="775" y="166" text-anchor="middle" font-size="11" fill="#475569">TLS / PSK</text>
  <text x="775" y="184" text-anchor="middle" font-size="11" fill="#475569">encrypted</text>

  <!-- Arrow 5->6 -->
  <line x1="850" y1="150" x2="868" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Box 6 -->
  <rect x="870" y="90" width="150" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="885" cy="90" r="12" fill="#7c3aed"/>
  <text x="885" y="95" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">6</text>
  <text x="945" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Dashboard</text>
  <text x="945" y="147" text-anchor="middle" font-size="11" fill="#6d28d9">Agent shows</text>
  <text x="945" y="166" text-anchor="middle" font-size="11" fill="#475569">Active (1)</text>
  <text x="945" y="184" text-anchor="middle" font-size="11" fill="#475569">Alerts indexing</text>

  <text x="520" y="270" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Illustrative pairing/enrollment flow — not a screenshot</text>
</svg>
